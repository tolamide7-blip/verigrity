<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verigrity Website Trust Checker</title><link rel="stylesheet" href="styles.css"></head><body style="background:#f7f9fc"><div style="max-width:680px;margin:25px auto;padding:20px;background:#fff;border:1px solid #dfe7f0;border-radius:16px"><a class="logo" href="https://verigrity.com"><img src="logo.svg" width="32" height="32" alt=""> Verigrity</a><p>Free website trust-signal checker.</p><form id="f"><input id="u" required placeholder="example.com" style="width:100%;padding:13px;border:1px solid #ccd7e3;border-radius:9px"><button class="button" style="margin-top:10px">Check website</button></form><div id="o" style="margin-top:16px"></div><p style="font-size:.78rem;color:#75869a">Powered by <a href="https://verigrity.com">Verigrity</a>.</p></div><script>f.onsubmit=async e=>{e.preventDefault();o.textContent="Checking…";try{let r=await fetch("/api/trust?url="+encodeURIComponent(u.value));let d=await r.json();o.innerHTML=r.ok?`<strong>Verigrity score: ${d.score}/100</strong><p>Review the full report before important decisions.</p><a href="https://verigrity.com/">Open Verigrity</a>`:`${d.error||"Check unavailable"}`}catch{x=o.textContent="Check unavailable"}}</script><div class="cookie-banner" id="cookieBanner" role="dialog" aria-label="Cookie choices"><strong>Privacy choices</strong><p>Verigrity may use essential technologies and, if enabled, analytics or advertising technologies. Non-essential technologies should be used only according to applicable consent requirements.</p><div class="cookie-actions"><button class="button" type="button" onclick="cookieChoice('accept')">Accept</button><button class="button secondary" type="button" onclick="cookieChoice('reject')">Reject non-essential</button><a class="button secondary" href="cookies.html">Cookie details</a></div></div><script>function cookieChoice(v){try{localStorage.setItem('verigrity_cookie_choice',v)}catch(e){}document.getElementById('cookieBanner')?.classList.remove('show')}try{if(!localStorage.getItem('verigrity_cookie_choice'))document.getElementById('cookieBanner')?.classList.add('show')}catch(e){document.getElementById('cookieBanner')?.classList.add('show')}</script></body></html>
