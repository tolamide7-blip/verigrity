<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Embed Verigrity Trust Checker</title>
<meta name="description" content="Embed the free Verigrity Trust Checker on your website or blog.">
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f9fc;color:#1e3042;margin:0}
.wrap{max-width:820px;margin:0 auto;padding:40px 20px}
.card{background:#fff;border:1px solid #dfe7ef;border-radius:16px;padding:28px;box-shadow:0 8px 30px rgba(20,50,80,.07)}
h1{margin-top:0}.snippet{width:100%;min-height:150px;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;padding:14px;border:1px solid #cbd7e3;border-radius:10px;box-sizing:border-box}
button{margin-top:12px;border:0;border-radius:10px;padding:12px 18px;background:#0f4c81;color:#fff;font-weight:700;cursor:pointer}
.note{color:#536779;font-size:14px;line-height:1.6}
iframe{border:0;border-radius:12px;width:100%;height:300px}
</style>
</head>
<body>
<main class="wrap">
<section class="card">
<h1>Embed Verigrity</h1>
<p>Add the free Verigrity Trust Checker to a blog, resource page, or website.</p>
<textarea class="snippet" readonly id="code">&lt;iframe src="https://verigrity.com/#checker-tool" title="Verigrity Trust Checker" width="100%" height="300" loading="lazy" style="border:0;border-radius:12px;"&gt;&lt;/iframe&gt;</textarea>
<button id="copy">Copy embed code</button>
<p class="note">The embedded checker remains subject to the target site's response time and Verigrity's stated limitations. Do not describe a score as proof that a site is safe or a scam.</p>
<h2>Preview</h2>
<iframe src="https://verigrity.com/#checker-tool" title="Verigrity Trust Checker preview" loading="lazy"></iframe>
</section>
</main>
<script>
document.getElementById("copy").addEventListener("click",async()=>{
 const el=document.getElementById("code");
 try{await navigator.clipboard.writeText(el.value);document.getElementById("copy").textContent="Copied";setTimeout(()=>document.getElementById("copy").textContent="Copy embed code",1500)}
 catch(e){el.select();document.execCommand("copy");document.getElementById("copy").textContent="Copied"}
});
</script>
</body>
</html>
